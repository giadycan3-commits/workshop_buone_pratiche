<style>
/* Layout: intestazione con contatori, tre viste (Aggiungi, Bacheca, Restituzione), schede morbide come nell'app Scuole in fiera. */

.card{--oc:var(--c1);--ocs:var(--c1s);position:relative;background:var(--card);border-radius:24px;padding:20px 20px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden}

.card.scartata{opacity:.5}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.otag{font-size:13px;font-weight:700;background:var(--ocs);color:var(--ink);border-radius:999px;padding:3px 12px}
.spill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}

.chd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.cname{font:700 21px/1.18 var(--display);letter-spacing:-.01em;margin:0}
.school{font-size:14px;color:var(--muted);margin-top:4px}
.ring{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--oc) calc(var(--p)*1%),var(--ocs) 0);flex:none}
.ring>div{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--card);font:800 17px var(--display)}
.card .proj{font-size:15px;color:var(--ink)}
.blk{border-radius:14px;padding:10px 14px;background:var(--bg)}
.blk .bl{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:2px}
.blk p{font-size:15px}
.blk.pitch{background:var(--ocs)}
.blk.pitch p{font-style:italic}
.blk.pot{background:var(--c3s)}
.cmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.card a.src,.card a.src:visited{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--oc);background:var(--bg);border-radius:999px;padding:4px 12px;text-decoration:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.card.o4 a.src,.card.o4 a.src:visited,.card.o5 a.src,.card.o5 a.src:visited{color:var(--ink)}
.card a.src:hover{box-shadow:inset 0 0 0 1.5px var(--oc)}
.by{font-size:13px;color:var(--muted);flex-basis:100%}
.cfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.cfoot select{width:auto;padding:5px 8px;font-size:13px;border-radius:10px}
.vote{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--c2);background:var(--card);color:var(--c2);border-radius:999px;padding:6px 8px 6px 14px;font:700 14px var(--body);cursor:pointer}

.vote[aria-pressed="true"]{background:var(--c2);color:var(--on)}
.vote[aria-pressed="true"] .vn{background:rgba(255,255,255,.3);color:var(--on)}
.xbtn{margin-left:auto;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer;padding:4px 8px;border-radius:8px}
.xbtn:hover{color:var(--warn)}
.empty{padding:34px 22px;border:2px dashed var(--line);border-radius:22px;color:var(--muted);text-align:center;background:var(--card);grid-column:1/-1}
.empty b{display:block;color:var(--ink);font:700 20px var(--display);margin-bottom:6px}
/* barra della bacheca */
.bar{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px;display:grid;gap:14px}
.bar .row1{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.bar .f{min-width:170px;flex:1}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fc{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px var(--body);cursor:pointer}
.fc b{font-weight:700;margin-left:6px;color:var(--muted)}
.fc[aria-pressed="true"]{background:var(--c1);border-color:var(--c1);color:var(--on)}
.fc[aria-pressed="true"] b{color:var(--on)}
/* restituzione */
.stage{background:var(--card);border-radius:28px;padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);min-height:340px;display:flex;flex-direction:column;gap:14px}
.stage .cname{font-size:clamp(28px,5vw,44px)}
.stage .pitch{font-size:clamp(18px,2.4vw,24px);line-height:1.45}
.stage .proj{font-size:clamp(16px,2vw,19px);color:var(--muted)}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto}
.nav .pos{color:var(--muted);font-size:14px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c1s);font:700 14px var(--display)}
.rank button{all:unset;cursor:pointer;font-weight:600;line-height:1.25}
.rank button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.rank .v{font-weight:700;color:var(--c2)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="wrap">

    <div>
      <h1>Raccolta buone pratiche</h1>

      <div class="cnt"><b id="nTot">0</b><span>schede</span></div>

  <nav class="tabs" role="tablist" aria-label="Viste">

    <button class="tab" role="tab" id="t-restituzione" aria-selected="false" aria-controls="v-restituzione" data-go="restituzione">Restituzione</button>

      </aside>
    </div>
  </section>
</div>

/* ---- scarico ---- */
function conData(name){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};var st=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());var i=name.lastIndexOf('.');return name.slice(0,i)+'_'+st+name.slice(i)}
async function scarica(name,data){
  var m=$('#dlMsg');m.className='msg';
  if(!P.length){m.textContent='Non ci sono ancora schede da scaricare.';return}
  try{var dl=await window.claude.use('downloads');if(!dl){m.textContent='Il download non è disponibile in questa vista.';return}
    await dl.save({filename:conData(name),data:data});m.className='msg ok';m.textContent='File pronto: '+P.length+' schede.'}
  catch(e){m.textContent=(e&&e.code==='declined')?'Salvataggio annullato.':'Non sono riuscito a creare il file.'}
}
var COLS=[['coppia','Trovata da (corsista)'],['ordine','Ordine di scuola'],['scuola','Scuola'],['comune','Comune'],['provincia','Provincia'],['codice','Codice meccanografico'],['sito','Sito della scuola'],['titolo','Titolo della buona pratica'],['progetto','Progetto'],['passante','Il passante'],['link','Link alla fonte'],['anno','Anno'],['s1','Ti fa fermare'],['s2','Si spiega in 30 secondi'],['s3','Si prova subito'],['pitch','Spiegazione in 30 secondi'],['potenziare','Come potenziare l\'idea'],['stato','Stato']];
$('#dlCsv').addEventListener('click',function(){
  var rows=[COLS.map(function(c){return c[1]}).concat(['Voti'])].concat(filtered().map(function(p){return COLS.map(function(c){return p[c[0]]==null?'':p[c[0]]}).concat([nVotes(p.id)])}));
  var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')}).join('\r\n');
  scarica('buone-pratiche.csv',csv)});

/* ---- foglio elettronico ---- */
function parseCsv(t){var rows=[],r=[],f='',q=false;t=String(t).replace(/^﻿/,'');
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(function(x){return x.some(function(y){return y!==''})})}
function testoDa(res){
  var p=res&&res.payload,c=res&&res.content||[];
  function dec(b){try{var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}catch(e){return null}}
  function viaObj(o){if(!o||typeof o!=='object')return null;
    var b=o.base64Content||o.base64||o.data||o.blob||(o.resource&&(o.resource.blob||o.resource.text));
    if(o.text&&typeof o.text==='string')return o.text;
    if(o.content&&typeof o.content==='string')return viaStr(o.content);
    if(typeof b==='string')return viaStr(b);return null}
  function viaStr(x){if(/^id[,;]/.test(x.trim()))return x;var d=dec(x);return d&&/^﻿?id[,;]/.test(d.trim())?d:(d||x)}
  if(typeof p==='string')return viaStr(p);
  var t=viaObj(p);if(t)return t;
  for(var k=0;k<c.length;k++){t=viaObj(c[k]);if(t)return t}
  return null}
function daFoglio(res){
  var txt=testoDa(res);if(txt==null)throw new Error('formato');
  var rows=parseCsv(txt);if(!rows.length)return [];
  var h=rows[0].map(function(x){return x.trim()});
  return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]==null?'':r[i]});
    ['s1','s2','s3','anno'].forEach(function(k){o[k]=o[k]===''?null:Number(o[k])});
    o.creata=o.inviata||'';return o}).filter(function(o){return o.id})}
function sync(msg,err){var e=$('#sync');e.textContent=msg;e.className='hint'+(err?' bad':'')}
function applica(){P.forEach(function(p){p.stato=(ST[p.id]&&ST[p.id].stato)||'da verificare'})}
function aggiorna(list){P=list;applica();render();
  var d=new Date();sync(P.length+' schede dal foglio · aggiornato alle '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+' · si aggiorna da solo ogni mezzo minuto')}
function erroreFoglio(er){var c=er&&er.code;
  sync(c==='needs_reauth'?'Riconnetti Google Drive in Impostazioni > Connettori, poi ricarica.':
    c==='server_not_connected'?'Aggiungi il connettore Google Drive in Impostazioni > Connettori, poi ricarica.':
    c==='not_in_manifest'||c==='approval_required'||c==='consent_required'?'Serve il permesso di leggere Google Drive per questa pagina.':
    c==='tool_error'?'Il foglio non si apre: controlla che sia ancora nel tuo Drive.':
    c==='server_unavailable'?'Drive non risponde, riprovo tra poco.':
    er&&er.message==='formato'?'Ho letto il foglio ma non riconosco il formato.':'Non riesco a leggere il foglio ('+(c||'errore')+').',true)}
async function init(){
  render();
  var h=location.hash.slice(1);if(['bacheca','restituzione'].indexOf(h)>=0)go(h);
  try{
    var cl=window.claude;if(!cl||!cl.use){sync('Apri la pagina dall\'app Claude per leggere il foglio.',true);return}
    var db=await cl.use('db'),user=await cl.use('user'),mcp=await cl.use('mcp');
    if(db){DB=db;if(user){try{ME=await user.id()}catch(e){}try{CANEDIT=!!(await user.canEdit())}catch(e){}}
      db.collection(STATI).onSnapshot(function(s){ST={};s.docs.forEach(function(d){ST[d.id]=d.data()||{}});applica();render()},function(){});
      db.collection(VOTI).onSnapshot(function(s){V=s.docs.map(function(d){return d.data()||{}});render()},function(){V=[];render()})}
    if(!mcp){sync('Il collegamento a Google Drive non è disponibile in questa vista: apri la pagina dall\'app Claude.',true);return}
    mcp.watchTool('Google Drive','download_file_content',{fileId:FOGLIO,exportMimeType:'text/csv'},function(ev){
      if(ev.type==='data'){try{aggiorna(daFoglio(ev.result))}catch(e){erroreFoglio({message:'formato'})}}
      else erroreFoglio(ev.error)},{refetchInterval:30000});
  }catch(e){sync('Non riesco a collegare il foglio.',true)}
}
init();
})();
